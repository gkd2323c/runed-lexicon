name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install validation dependencies
        # zhconv is optional for local runs (CHAR001 degrades to WARNING
        # without it), but CI installs it so the gate selftest asserts
        # the same PASS baseline as a fully provisioned machine.
        run: pip install pyyaml zhconv

      - name: Unit tests (unittest discover per skill)
        shell: bash
        run: |
          set -e
          found=0
          for d in .agents/skills/*/scripts; do
            if compgen -G "$d/test_*.py" > /dev/null; then
              # Standalone-style tests (main() entry, no unittest.TestCase)
              # are executed by the next step; discover would exit 5 (NO TESTS RAN).
              if grep -lq "unittest" "$d"/test_*.py; then
                echo "--- unittest discover: $d"
                python -m unittest discover -s "$d" -p "test_*.py"
                found=1
              else
                echo "--- skip discover (standalone-style only): $d"
              fi
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No unittest-style tests found under .agents/skills/*/scripts"
            exit 1
          fi

      - name: Standalone regression scripts
        shell: bash
        run: |
          set -e
          python .agents/skills/xtranslator-xml-writer/scripts/test_patch_mode.py
          python .agents/skills/xtranslator-xml-writer/scripts/test_incremental_mode.py
          python .agents/skills/noninfo-batch-planner/scripts/test_plan_noninfo.py
          python .agents/skills/translation-review-tools/scripts/test_review_tools.py
          python .agents/skills/translation-quality-gate/scripts/selftest_corpus.py
          python .agents/skills/translation-fidelity-scan/scripts/test_fidelity_scan.py
          python corpus/translation-regression/scripts/validate_corpus.py

      - name: Skill quick validation (all skills)
        shell: bash
        run: |
          set -e
          for d in .agents/skills/*/; do
            if [ -f "$d/SKILL.md" ]; then
              echo "--- quick_validate: $d"
              python .agents/skills/skill-creator/scripts/quick_validate.py "$d"
            fi
          done

      - name: Syntax floor check (whole repo)
        # Mirrors tools/pre-push-check.py [4/4]. Runs on every supported
        # version: the 3.10/3.11 legs are what catch syntax that only parses
        # on 3.12+ (PEP 701 f-string quote reuse), which a 3.14 dev box cannot
        # see. Compiles first-party .py only; git decides the file set.
        run: python tools/pre-push-check.py --syntax-only
